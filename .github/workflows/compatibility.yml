name: Compatibility

# The Plugin Verifier on every supported Rider line, weekly and on demand, so a break shows up
# even when no PR runs. The same job runs on each PR (build.yml); the table is in the run summary.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      pull-requests: write # unused here (no PR); the called workflow asks for it
