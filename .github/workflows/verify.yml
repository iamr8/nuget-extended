name: Verify

# IntelliJ Plugin Verifier on every supported Rider line (the newest patch of each), one job per
# IDE so the multi-GB downloads run in parallel. The report job builds the same table the
# Marketplace "Compatibility verification" page shows. It goes to the run summary, and on a PR to
# one comment that every run updates in place. Called by build.yml (PRs, main) and
# compatibility.yml (weekly). To add a Rider line, add it to the matrix below.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Rider ${{ matrix.rider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Newest first, like the Marketplace page. 2024.3 is the since-build floor (243).
        rider: ["2026.2.4.1", "2026.1.5.3", "2025.3.5.3", "2025.2.6.2", "2025.1.9", "2024.3.10"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Plugin Verifier
        id: verify
        run: ./gradlew verifyPlugin -PverifierIdes=${{ matrix.rider }} -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      - name: Write report row
        if: always()
        env:
          RIDER: ${{ matrix.rider }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          verdict_file=$(find build/reports/pluginVerifier -name verification-verdict.txt 2>/dev/null | head -1)
          verdict=$( [ -n "$verdict_file" ] && tr '\n' ' ' < "$verdict_file" | sed 's/ *$//' || true )
          jar=$(find ~/.gradle/caches -name 'verifier-cli-*-all.jar' 2>/dev/null | head -1)
          verifier=$(basename "${jar:-verifier-cli-?-all.jar}" | sed -E 's/^verifier-cli-(.*)-all\.jar$/\1/')
          if [ "$OUTCOME" != "success" ] || [ -z "$verdict" ]; then
            status="❌ Failed"
            [ -n "$verdict" ] || verdict="No verdict: see the job log."
          elif echo "$verdict" | grep -qiE 'deprecated|experimental|internal|override-only|non-extendable'; then
            status="⚠️ Warnings"
          else
            status="✅ Success"
          fi
          date=$(date -u '+%d %b %Y %H:%M')
          mkdir -p row
          printf '| %s | Rider | %s | %s | %s | %s |\n' "$status" "$RIDER" "$date" "$verifier" "$verdict" > "row/$RIDER.md"
          cat "row/$RIDER.md"

      - name: Upload report row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-row-${{ matrix.rider }}
          path: row/
          if-no-files-found: warn

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report-${{ matrix.rider }}
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn

  report:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the PR comment
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: verifier-row-*
          path: rows
          merge-multiple: true

      - name: Build the table
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '<!-- plugin-verifier-report -->'
            echo '## Compatibility verification'
            echo
            echo '| Status | Product name | Version | Date | Verifier | Verification verdict |'
            echo '|---|---|---|---|---|---|'
            # Newest Rider first.
            find rows -name '*.md' 2>/dev/null | sort -V -r | while read -r f; do cat "$f"; done
            echo
            echo "IntelliJ Plugin Verifier, run [${{ github.run_id }}]($RUN_URL) on \`${GITHUB_SHA::7}\`. Full reports are in the run artifacts."
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the PR comment
        if: github.event_name == 'pull_request'
        # A fork or Dependabot PR gets a read-only token: the table is still in the run summary.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- plugin-verifier-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md > /dev/null
          fi

      # This job is a required check on main, so a compatibility failure blocks the merge.
      - name: Fail when a Rider line failed
        if: needs.verify.result != 'success'
        run: |
          echo "::error::The Plugin Verifier failed on at least one Rider line. See the table above."
          exit 1
